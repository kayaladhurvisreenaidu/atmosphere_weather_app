name: atmosphere_weather
description: A responsive Flutter weather experience.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5
  http: ^1.3.0
  shared_preferences: ^2.5.3
  flutter_map: ^8.3.2
  latlong2: ^0.9.1
  fl_chart: ^0.70.2
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/seasons/